openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dmaic
    description: DMAIC Agile project operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dmaic/pipeline:
    post:
      operationId: runDmaicPipeline
      tags: [dmaic]
      summary: Generate a complete DMAIC Agile pipeline
      description: Creates structured Definition, Measurement, and A-I-C sprint artifacts from a project problem statement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmaicPipelineInput"
      responses:
        "200":
          description: DMAIC artifacts generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmaicPipeline"
        "400":
          description: Invalid problem statement
        "502":
          description: AI generation failed
  /dmaic/workspace:
    get:
      operationId: getDmaicWorkspace
      tags: [dmaic]
      summary: Load the active DMAIC workspace
      description: Loads the persisted Project Charter, problem statement, and any AI suggestions still awaiting review.
      responses:
        "200":
          description: Persisted workspace, or an empty workspace when none exists yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmaicWorkspace"
    put:
      operationId: saveDmaicWorkspace
      tags: [dmaic]
      summary: Save the active DMAIC workspace
      description: Persists the Project Charter, problem statement, and the review status of AI suggestions in Neon Postgres.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmaicWorkspaceInput"
      responses:
        "200":
          description: Workspace saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmaicWorkspace"
        "400":
          description: Invalid workspace data
        "500":
          description: Workspace persistence failed
  /dmaic/exploratory-diagnosis:
    post:
      operationId: runDmaicExploratoryDiagnosis
      tags: [dmaic]
      summary: Generate an exploratory time-series diagnosis
      description: Generates a Gemini interpretation from the currently selected local indicator observations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmaicExploratoryDiagnosisInput"
      responses:
        "200":
          description: Exploratory diagnosis generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmaicExploratoryDiagnosis"
        "400":
          description: Invalid exploratory analysis data
        "429":
          description: Exploratory diagnosis rate limit reached
        "503":
          description: Gemini integration is not configured
        "502":
          description: AI generation failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DmaicPipelineInput:
      type: object
      required: [problemStatement]
      properties:
        problemStatement:
          type: string
          minLength: 10
          maxLength: 4000
        projectCharterContext:
          $ref: "#/components/schemas/DmaicCharterContext"
    DmaicExploratoryPoint:
      type: object
      required: [period, value]
      properties:
        period: { type: string, maxLength: 120 }
        value: { type: number }
    DmaicExploratoryStatistics:
      type: object
      required: [count, mean, median, minimum, q1, q3, maximum, iqr, standardDeviation]
      properties:
        count: { type: number, minimum: 1 }
        mean: { type: number }
        median: { type: number }
        minimum: { type: number }
        q1: { type: number }
        q3: { type: number }
        maximum: { type: number }
        iqr: { type: number }
        standardDeviation: { type: number }
        shapiroW: { type: number, minimum: 0, maximum: 1 }
        shapiroPValue: { type: number, minimum: 0, maximum: 1 }
    DmaicExploratoryDiagnosisInput:
      type: object
      required: [indicator, points, statistics]
      properties:
        indicator: { type: string, minLength: 1, maxLength: 120 }
        timeColumn: { type: string, maxLength: 120 }
        points:
          type: array
          minItems: 2
          maxItems: 240
          items:
            $ref: "#/components/schemas/DmaicExploratoryPoint"
        statistics:
          $ref: "#/components/schemas/DmaicExploratoryStatistics"
    DmaicExploratoryDiagnosis:
      type: object
      required: [diagnosis]
      properties:
        diagnosis: { type: string, minLength: 1, maxLength: 16000 }
    DmaicCharterTeamMember:
      type: object
      required: [role, name, position, areaCompany]
      properties:
        role: { type: string }
        name: { type: string }
        position: { type: string }
        areaCompany: { type: string }
    DmaicCharterContext:
      type: object
      required:
        - projectName
        - client
        - area
        - leader
        - sponsor
        - date
        - objective
        - history
        - goalDefinition
        - kpis
        - includedScope
        - excludedScope
        - assumptionsAndConstraints
        - team
        - customerRequirements
        - businessContributions
      properties:
        projectName: { type: string }
        client: { type: string }
        area: { type: string }
        leader: { type: string }
        sponsor: { type: string }
        date: { type: string, format: date }
        objective: { type: string }
        history: { type: string }
        goalDefinition: { type: string }
        kpis: { type: string }
        includedScope: { type: string }
        excludedScope: { type: string }
        assumptionsAndConstraints: { type: string }
        team:
          type: array
          items:
            $ref: "#/components/schemas/DmaicCharterTeamMember"
        customerRequirements: { type: string }
        businessContributions: { type: string }
    DmaicWorkspaceInput:
      type: object
      required: [problemStatement, projectCharterContext, aiCharterSuggestions]
      properties:
        problemStatement:
          type: string
          minLength: 10
          maxLength: 4000
        projectCharterContext:
          $ref: "#/components/schemas/DmaicCharterContext"
        aiCharterSuggestions:
          description: AI-generated Charter content that remains pending team review. Send null when the Charter is confirmed.
          anyOf:
            - $ref: "#/components/schemas/DmaicGeneratedCharter"
            - type: "null"
    DmaicWorkspace:
      type: object
      required: [projectKey, hasSavedData, problemStatement, projectCharterContext, aiCharterSuggestions, createdAt, updatedAt]
      properties:
        projectKey: { type: string }
        hasSavedData: { type: boolean }
        problemStatement: { type: string }
        projectCharterContext:
          $ref: "#/components/schemas/DmaicCharterContext"
        aiCharterSuggestions:
          description: AI-generated Charter content that remains pending team review, or null after confirmation.
          anyOf:
            - $ref: "#/components/schemas/DmaicGeneratedCharter"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DmaicCharter:
      type: object
      required: [projectTitle, problemStatement, businessCase, expectedSavings]
      properties:
        projectTitle: { type: string }
        problemStatement: { type: string }
        businessCase: { type: string }
        expectedSavings: { type: string }
    DmaicGeneratedCharter:
      type: object
      description: Editable Project Charter suggestions generated from the problem statement.
      required:
        - objective
        - history
        - goalDefinition
        - kpis
        - includedScope
        - excludedScope
        - assumptionsAndConstraints
        - customerRequirements
        - businessContributions
      properties:
        objective: { type: string }
        history: { type: string }
        goalDefinition: { type: string }
        kpis: { type: string }
        includedScope: { type: string }
        excludedScope: { type: string }
        assumptionsAndConstraints: { type: string }
        customerRequirements: { type: string }
        businessContributions: { type: string }
    DmaicTeam:
      type: object
      required: [productOwner, scrumMaster, beltSquadMembers]
      properties:
        productOwner: { type: string }
        scrumMaster: { type: string }
        beltSquadMembers: { type: string }
    DmaicVocCqt:
      type: object
      required: [vocNeed, issue, ctqMetric]
      properties:
        vocNeed: { type: string }
        issue: { type: string }
        ctqMetric: { type: string }
    DmaicIndicator:
      type: object
      required: [primaryMetricY, operationalDefinition, targetGoal, baseline]
      properties:
        primaryMetricY: { type: string }
        operationalDefinition: { type: string }
        targetGoal: { type: string }
        baseline: { type: string }
    DmaicSipoc:
      type: object
      required: [suppliers, inputs, process, outputs, customers]
      properties:
        suppliers:
          type: array
          items: { type: string }
        inputs:
          type: array
          items: { type: string }
        process:
          type: array
          items: { type: string }
        outputs:
          type: array
          items: { type: string }
        customers:
          type: array
          items: { type: string }
    DmaicScope:
      type: object
      required: [inScope, outOfScope]
      properties:
        inScope:
          type: array
          items: { type: string }
        outOfScope:
          type: array
          items: { type: string }
    DmaicRow:
      type: object
      additionalProperties:
        type: string
    DmaicPipeline:
      type: object
      required:
        - generatedCharter
        - projectCharter
        - teamSetup
        - vocCtq
        - indicatorsY
        - sipoc
        - inOutMatrix
        - msaValidation
        - ishikawa
        - gutPrioritization
        - vitalXs
        - hypotheses
        - fmea
        - actionPlan
        - controlPlan
        - standardizationSop
      properties:
        generatedCharter:
          $ref: "#/components/schemas/DmaicGeneratedCharter"
        projectCharter:
          $ref: "#/components/schemas/DmaicCharter"
        teamSetup:
          $ref: "#/components/schemas/DmaicTeam"
        vocCtq:
          type: array
          items:
            $ref: "#/components/schemas/DmaicVocCqt"
        indicatorsY:
          $ref: "#/components/schemas/DmaicIndicator"
        sipoc:
          $ref: "#/components/schemas/DmaicSipoc"
        inOutMatrix:
          $ref: "#/components/schemas/DmaicScope"
        msaValidation:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"
        ishikawa:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        gutPrioritization:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"
        vitalXs:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"
        hypotheses:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"
        fmea:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"
        controlPlan:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"
        standardizationSop:
          type: array
          items:
            $ref: "#/components/schemas/DmaicRow"

