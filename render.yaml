services:
  - type: web
    name: dmaic-agil-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: "cd . && pnpm install && pnpm --dir artifacts/api-server build"
    startCommand: "cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
